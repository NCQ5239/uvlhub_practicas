name: Codacy CI

on:

  push:
    branches:
      - main

jobs:

  codacy:

    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:12.0.2
        env:
          MARIADB_ROOT_PASSWORD: uvlhub_root_password
          MARIADB_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -u root -p$MARIADB_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    # Modificacion 2: comprobar la compatibilidad con varias versiones de Python.
    # El proyecto declara requires-python = ">=3.13", asi que 3.13 es el suelo y
    # 3.14 la siguiente: la matriz avisa de la ruptura antes de que toque migrar.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ./rosemary

    # Modificacion 1: buscar versiones nuevas de las dependencias instaladas.
    # Va DESPUES de instalar requirements.txt: colocado antes solo listaria los
    # paquetes que el runner trae de serie, que no son los del proyecto.
    - name: Check for outdated dependencies
      run: |
        pip list --outdated

    # Modificacion 3: analisis de seguridad de las dependencias instaladas.
    - name: Security audit with pip-audit
      run: |
        pip install pip-audit
        pip-audit || true

    # La cobertura se sube una sola vez: con la matriz activa y sin este filtro,
    # Codacy recibiria dos informes distintos del mismo commit.
    - name: Run tests with coverage
      run: |
        coverage run -m pytest app/features/ --ignore-glob='*selenium*'
        coverage xml
      env:
        FLASK_ENV: testing
        MARIADB_HOSTNAME: 127.0.0.1
        MARIADB_PORT: 3306
        MARIADB_TEST_DATABASE: uvlhubdb_test
        MARIADB_USER: uvlhub_user
        MARIADB_PASSWORD: uvlhub_password

    # El paquete PyPI codacy-coverage (python-codacy-coverage) esta archivado
    # desde 2020 y su endpoint ya no existe: se usa el uploader oficial.
    - name: Upload coverage to Codacy
      if: matrix.python-version == '3.13'
      run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
      env:
        CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}